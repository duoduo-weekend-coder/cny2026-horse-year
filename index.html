<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 馬年大吉 | 扭一扭，扭转乾坤🌀</title>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    :root {
      --red-primary: #C41E24;
      --red-dark: #8B0000;
      --red-light: #E74C3C;
      --gold-primary: #D4A843;
      --gold-light: #F0D68A;
      --gold-dark: #B8860B;
      --cream: #FFF8E7;
      --bg-dark: #201520; /* Dark purple-grey to match the image bottom */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      /* Fallback gradient matching the image sky (Purple -> Orange -> Dark) */
      background: linear-gradient(180deg, #5D4157 0%, #A88BEB 20%, #F8CE6A 50%, #FF9F1C 70%, #2C2C3A 100%);
      /* The uploaded image (background.png) - show full image */
      background-image: 
        url('background.png'), 
        linear-gradient(180deg, #5D4157 0%, #A88BEB 20%, #F8CE6A 50%, #FF9F1C 70%, #2C2C3A 100%);
      background-size: contain, cover; /* 'contain' ensures full image is visible */
      background-position: center top, center;
      background-attachment: fixed, fixed;
      background-repeat: no-repeat, no-repeat;
      background-color: #201520; /* Fallback color matching dark areas */
      color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Background overlay for readability */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      /* Dark semi-transparent overlay to make text pop against the busy illustration */
      background: rgba(30, 20, 30, 0.5);
      backdrop-filter: blur(2px); /* Slight blur to soften details */
      -webkit-backdrop-filter: blur(2px);
      pointer-events: none;
      z-index: 0;
    }

    /* Fireworks canvas */
    #fireworks-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* Floating lanterns */
    .lantern {
      position: fixed;
      width: 40px;
      height: 55px;
      animation: float 6s ease-in-out infinite;
      z-index: 1;
      opacity: 0.8;
      pointer-events: none;
    }
    .lantern:nth-of-type(1) { left: 5%; top: 5%; animation-delay: 0s; transform: scale(1); }
    .lantern:nth-of-type(2) { right: 8%; top: 12%; animation-delay: 1.5s; transform: scale(0.9); }
    .lantern:nth-of-type(3) { left: 15%; top: 15%; animation-delay: 2s; transform: scale(0.7); opacity: 0.6; filter: blur(1px); }
    .lantern:nth-of-type(4) { right: 20%; top: 8%; animation-delay: 0.5s; transform: scale(0.8); }
    .lantern:nth-of-type(5) { left: 35%; top: 2%; animation-delay: 3s; transform: scale(0.6); opacity: 0.5; filter: blur(2px); }
    .lantern:nth-of-type(6) { right: 35%; top: 18%; animation-delay: 1s; transform: scale(0.85); }
    .lantern:nth-of-type(7) { left: 50%; top: -2%; animation-delay: 4s; transform: scale(0.5); opacity: 0.4; filter: blur(2px); }
    .lantern:nth-of-type(8) { left: 2%; top: 25%; animation-delay: 2.5s; transform: scale(0.75); }
    .lantern:nth-of-type(9) { right: 2%; top: 30%; animation-delay: 0.8s; transform: scale(0.8); }
    .lantern:nth-of-type(10) { left: 80%; top: 22%; animation-delay: 3.5s; transform: scale(0.65); opacity: 0.7; }
    .lantern:nth-of-type(11) { right: 60%; top: 4%; animation-delay: 1.2s; transform: scale(0.55); opacity: 0.5; filter: blur(1px); }
    .lantern:nth-of-type(12) { left: 25%; top: 35%; animation-delay: 2.2s; transform: scale(0.7); opacity: 0.6; }

    .lantern-body {
      width: 100%; height: 70%;
      background: linear-gradient(135deg, #ff4444, var(--red-primary));
      border-radius: 50% 50% 45% 45%;
      position: relative;
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.4);
    }
    .lantern-body::before {
      content: '福';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: var(--gold-primary);
      font-size: 14px;
      font-weight: 900;
      font-family: 'Noto Serif SC', serif;
    }
    .lantern-top {
      width: 50%; height: 8px;
      background: var(--gold-primary);
      margin: 0 auto;
      border-radius: 3px 3px 0 0;
    }
    .lantern-line {
      width: 2px; height: 15px;
      background: var(--gold-dark);
      margin: 0 auto;
    }
    .lantern-tassel {
      width: 3px; height: 20px;
      background: linear-gradient(to bottom, var(--gold-primary), var(--red-primary));
      margin: 0 auto;
      border-radius: 0 0 2px 2px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-15px) rotate(2deg); }
    }

    /* Main container */
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      position: relative;
      z-index: 2;
      background: rgba(20, 15, 20, 0.3); /* Subtle dark glass */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
    }

    /* Header */
    .header {
      text-align: center;
      padding: 30px 0 20px;
    }
    .year-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
      color: var(--red-dark);
      padding: 4px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .header .subtitle {
      color: var(--gold-primary);
      font-size: 15px;
      opacity: 0.8;
      font-weight: 300;
    }

    /* Decorative divider */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
      opacity: 0.6;
    }
    .divider-line {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }
    .divider-icon {
      color: var(--gold-primary);
      font-size: 14px;
    }

    /* =========================================
       GASHAPON MACHINE (扭蛋机)
       ========================================= */
    .gashapon-section {
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .machine-container {
      width: 320px; /* Slightly wider for the new image aspect ratio */
      position: relative;
      z-index: 10;
    }

    /* Image-based Machine */
    .machine-img {
      width: 100%;
      display: block;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }

    .machine-container.shaking .machine-img {
      animation: shake-machine 0.5s ease-in-out infinite;
    }

    @keyframes shake-machine {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      10% { transform: translate(-1px, -2px) rotate(-1deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      30% { transform: translate(3px, 2px) rotate(0deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      50% { transform: translate(-1px, 2px) rotate(-1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      70% { transform: translate(3px, 1px) rotate(-1deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      90% { transform: translate(1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    /* Invisible Interaction Zones */
    .knob-zone {
      position: absolute;
      width: 25%;
      height: 25%;
      bottom: 18%;
      right: 18%;
      border-radius: 50%;
      cursor: pointer;
      z-index: 30; /* Higher than label */
    }
    
    .knob-zone:active {
        transform: scale(0.95);
    }
    
    /* Knob Label Animation */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .knob-label {
      position: absolute;
      bottom: 40%;
      right: 10%; /* Adjusted position */
      background: #fff;
      color: var(--red-primary);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      pointer-events: none;
      z-index: 25;
      animation: float 2s ease-in-out infinite;
      white-space: nowrap;
      text-align: center;
      border: 2px solid var(--gold-primary);
    }
    /* Triangle pointer for label */
    .knob-label::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; 
      height: 0; 
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #fff;
    }

    /* Exit location for capsule spawn origin */
    .exit-zone {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      /* background: blue; Debug */
    }
    
    /* Remove old CSS drawing styles to avoid clutter/conflict */
    /* .machine-top, .machine-body, etc. are no longer needed */


    /* =========================================
       CAPSULES (RESULTS)
       ========================================= */
    .capsules-tray {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
      min-height: 160px;
      width: 100%;
    }

    .capsule-wrapper {
      position: relative;
      width: 100px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    .capsule {
      width: 90px;
      height: 100px;
      position: relative;
      cursor: pointer;
      transition: all 0.5s ease;
      transform-origin: center bottom;
      opacity: 0;
      transform: translateY(-50px) scale(0.5);
    }

    .capsule.dropped {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: bounce-drop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes bounce-drop {
      0% { transform: translateY(-100px) scale(0.5); opacity: 0; }
      60% { transform: translateY(10px) scale(1.1); opacity: 1; }
      80% { transform: translateY(-5px) scale(0.95); }
      100% { transform: translateY(0) scale(1); }
    }

    /* Tangyuan Visuals (Replaces Capsule) */
    .capsule-top {
      width: 100%; height: 50%;
      background: #FDFDFD;
      border-radius: 50px 50px 0 0;
      position: absolute;
      top: 0; left: 0;
      z-index: 2;
      transition: transform 0.4s ease;
      /* Soft white dough shadow */
      box-shadow: 
        inset -5px -2px 10px rgba(0,0,0,0.05), 
        inset 5px 5px 15px rgba(255,255,255,0.8);
    }
    .capsule-bottom {
      width: 100%; height: 50%;
      background: #FDFDFD;
      border-radius: 0 0 50px 50px;
      position: absolute;
      bottom: 0; left: 0;
      z-index: 2;
      transition: transform 0.4s ease;
      box-shadow: 
        inset -5px -5px 10px rgba(0,0,0,0.05),
        inset 5px 2px 10px rgba(255,255,255,0.5);
    }

    /* Capsule Content (Hidden inside - The Filling) */
    .capsule-content {
      position: absolute;
      top: 15%; left: 15%;
      width: 70%; height: 70%;
      background: #333; /* Dark sesame filling default */
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 1;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.4s ease;
      padding: 5px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      color: #fff;
    }
    
    .capsule-content .icon { font-size: 20px; margin-bottom: 2px; }
    .capsule-content .label { font-size: 8px; color: rgba(255,255,255,0.7); margin-bottom: 1px; }
    .capsule-content .text { font-size: 12px; color: #fff; font-weight: bold; }

    /* Opened State */
    .capsule.opened .capsule-top { transform: translateY(-35px) rotate(-10deg); opacity: 0.9; }
    .capsule.opened .capsule-bottom { transform: translateY(35px) rotate(5deg); opacity: 0.9; }
    .capsule.opened .capsule-content { opacity: 1; transform: scale(1.1); z-index: 3; }
    .capsule.opened { cursor: default; pointer-events: none; }

    /* Colors for different Tangyuan fillings/flavors */
    /* Horse: Sakura (Pinkish) */
    .capsule.c1 .capsule-top, .capsule.c1 .capsule-bottom { background: radial-gradient(circle at 30% 30%, #FFF0F5, #FFE4E1); }
    .capsule.c1 .capsule-content { background: #D81B60; } /* Red Bean filling */

    /* Domain: Matcha (Greenish) */
    .capsule.c2 .capsule-top, .capsule.c2 .capsule-bottom { background: radial-gradient(circle at 30% 30%, #F1F8E9, #DCEDC8); }
    .capsule.c2 .capsule-content { background: #2E7D32; } /* Matcha filling */

    /* Blessing: Sesame/Plain (White) */
    .capsule.c3 .capsule-top, .capsule.c3 .capsule-bottom { background: radial-gradient(circle at 30% 30%, #FAFAFA, #EEEEEE); }
    .capsule.c3 .capsule-content { background: #212121; } /* Black Sesame filling */
    
    .instruction-text {
      text-align: center;
      color: var(--gold-primary);
      font-size: 12px;
      margin-top: 10px;
      opacity: 0.8;
      display: none; /* Hidden by default, shown by startDraw */
      animation: pulse-text 2s infinite;
    }
    @keyframes pulse-text { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

    /* Hide original cards */
    .cards-section { display: none !important; }


    .card.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Card front (before flip) */
    .card-front {
      background: linear-gradient(145deg, var(--red-primary), var(--red-dark));
      border: 2px solid var(--gold-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .card-front::before {
      content: '';
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      border: 1px solid rgba(212, 168, 67, 0.3);
      border-radius: 8px;
    }
    .card-front .card-pattern {
      font-size: 36px;
      opacity: 0.9;
    }
    .card-front .card-label-text {
      font-size: 11px;
      color: var(--gold-light);
      letter-spacing: 2px;
      opacity: 0.7;
    }
    .card-column-label {
      text-align: center;
      font-size: 11px;
      color: var(--gold-primary);
      margin-top: 8px;
      opacity: 0.6;
    }

    /* Card back (after flip) */
    .card-back {
      background: linear-gradient(145deg, var(--cream), #fff);
      border: 2px solid var(--gold-primary);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      text-align: center;
    }
    .card-back .horse-emoji {
      font-size: 40px;
      margin-bottom: 6px;
    }
    .card-back .horse-name {
      font-family: 'Noto Serif SC', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--red-primary);
      margin-bottom: 4px;
    }
    .card-back .horse-desc {
      font-size: 10px;
      color: #666;
      line-height: 1.4;
    }
    .card-back .domain-text {
      font-family: 'Noto Serif SC', serif;
      font-size: 26px;
      font-weight: 900;
      color: var(--red-primary);
    }
    .card-back .domain-emoji {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .card-back .blessing-text {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--red-dark);
      writing-mode: vertical-rl;
      letter-spacing: 4px;
    }

    /* Upload Section */
    .upload-container {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
    }
    .upload-box {
      width: 120px;
      height: 120px;
      border: 2px dashed var(--gold-primary);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(255, 248, 231, 0.05);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .upload-box:active { transform: scale(0.95); background: rgba(255, 248, 231, 0.1); }
    .upload-icon { font-size: 32px; margin-bottom: 4px; }
    .upload-text { font-size: 10px; color: var(--gold-primary); text-align: center; line-height: 1.4; }
    
    .image-preview {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 5;
      border-radius: 50%;
    }
    .image-preview.show { opacity: 1; }

    .upload-status {
      text-align: center;
      font-size: 12px;
      color: var(--gold-light);
      height: 20px;
      margin-bottom: 12px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .upload-status.visible { opacity: 1; }
    .upload-status.analyzing::after {
      content: '...';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    /* Result area */
    .result-section {
      margin-top: 24px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease;
      perspective: 1000px; /* Add perspective for 3D tilt */
      pointer-events: none; /* Prevent clicks when hidden */
    }
    .result-section.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto; /* Enable clicks when visible */
    }

    /* Greeting card (3D Tilt Container) */
    .greeting-card {
      background: linear-gradient(135deg, #FFF8E7, #FFF5E0);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      position: relative;
      border: 3px solid var(--gold-primary);
      box-shadow:
        0 10px 30px rgba(196, 30, 36, 0.3),
        inset 0 0 30px rgba(212, 168, 67, 0.1);
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out; /* Smooth movement */
      will-change: transform;
    }
    
    /* Inner Elements (Pop out) */
    .greeting-card .card-horse-img,
    .greeting-card .ai-image-container,
    .greeting-card .card-blessing,
    .greeting-card .card-domain,
    .greeting-card .card-message,
    .greeting-card .ai-badge {
      transform: translateZ(20px); /* Pop out effect */
      transition: transform 0.1s ease-out;
    }

    .greeting-card .ai-image-container {
      transform: translateZ(40px); /* Image pops out more */
      box-shadow: 0 15px 35px rgba(0,0,0,0.2); /* Enhanced shadow for depth */
    }

    /* Parallax Image Movement */
    .ai-generated-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.1s ease-out;
      transform: scale(1.1); /* Zoom in slightly to allow panning */
    }

    /* Keep existing styles */
    .greeting-card::before {
      content: '';
      position: absolute;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 1px dashed var(--gold-primary);
      border-radius: 10px;
      opacity: 0.4;
      pointer-events: none;
    }
    .greeting-card .card-horse-img {
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--red-light), var(--red-primary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      border: 3px solid var(--gold-primary);
      box-shadow: 0 4px 15px rgba(196, 30, 36, 0.3);
      position: relative;
      z-index: 1;
    }
    .greeting-card .card-blessing {
      font-family: 'Noto Serif SC', serif;
      font-size: 28px;
      font-weight: 900;
      color: var(--red-primary);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    .greeting-card .card-domain {
      font-size: 15px;
      color: var(--gold-dark);
      font-weight: 500;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }
    .greeting-card .card-message {
      font-size: 13px;
      color: #666;
      line-height: 1.8;
      position: relative;
      z-index: 1;
    }
    .greeting-card .card-year-stamp {
      margin-top: 16px;
      font-family: 'Noto Serif SC', serif;
      font-size: 12px;
      color: var(--red-primary);
      opacity: 0.5;
      position: relative;
      z-index: 1;
    }
    .ai-badge {
      display: inline-block;
      background: rgba(196, 30, 36, 0.1);
      color: var(--red-primary);
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 10px;
      margin-top: 12px;
      position: relative;
      z-index: 1;
    }

    .ai-image-container {
      width: 200px;
      height: 200px;
      margin: 0 auto 16px;
      border-radius: 12px;
      overflow: hidden;

      transition: opacity 0.5s ease;
    }

      opacity: 1;
    }

    .ai-image-container::before {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(196, 30, 36, 0.2);
      border-top-color: var(--red-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 0;
    }

      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease;
    }
    .buttons.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .btn {
      flex: 1;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;

      display: flex;
      align-items: center;

      margin: 30px 0;
    }

      display: inline-flex;

      gap: 8px;
      padding: 16px 40px;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-light), var(--gold-primary));

      color: var(--red-dark);
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 900;
      font-family: 'Noto Serif SC', serif;

      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }

    /* Sparkle animation on cards */
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }

      position: absolute;

      background: var(--gold-light);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);

      pointer-events: none;

function setLanguage(lang) {
  currentLang = lang;
  
  // Update Buttons UI
  document.querySelectorAll('.lang-btn').forEach(btn => {
    if (btn.textContent.trim().toLowerCase() === (lang === 'zh' ? '中文' : 'english')) {
       btn.classList.add('active');
    } else {
       btn.classList.remove('active');
    }
  });

  // Update Static Text
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) {
      el.innerHTML = translations[lang][key];
    }
  });

  // Update Landing Label (Pseudo-element attr)
  const landingZone = document.querySelector('.landing-click-zone');
  if (landingZone) {
    landingZone.setAttribute('data-label', translations[lang].landing_label);
  }

  // Update JS-driven UI if visible
  const instruction = document.getElementById('instructionText');
  if (instruction && instruction.style.display !== 'none') {
      instruction.textContent = isDrawing ? translations[lang].instruction_open : translations[lang].instruction_start;
  }
}

function handleImageUpload(input) {
  if (input.files && input.files[0]) {

    console.log("File selected:", file.name, file.size); // Debug

    const status = document.getElementById('uploadStatus');


    // Update Upload Box
    document.getElementById('uploadIcon').style.opacity = '0';
    document.getElementById('uploadText').style.opacity = '0';
    
    const img = document.getElementById('imagePreview');
    const objectUrl = URL.createObjectURL(file);
    img.src = objectUrl;
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      img.classList.add('show');
    };

    // Show Avatar Box
    const avatarBox = document.getElementById('avatarBox');
    avatarBox.style.display = 'flex';
    document.getElementById('avatarPreview').src = '';
    document.getElementById('avatarLoading').style.display = 'block';

    // Status: Analyzing
    status.textContent = 'AI正在提取特征...';
    status.className = 'upload-status visible analyzing';
    
    // Disable interactions

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout

    const response = await fetch('/api/image', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        prompt: prompt
      }),
      signal: controller.signal
    });
    
    clearTimeout(timeoutId);

    if (!response.ok) {

    const data = await response.json();
    return data.data[0].url;
  } catch (error) {

    return null;
  }

function convertToBase64(file) {
  return new Promise((resolve, reject) => {
    // 1. Create an off-screen image to resize
    const img = new Image();
    const reader = new FileReader();

    reader.onload = function(e) {
      img.src = e.target.result;
    };

    img.onload = function() {
      // 2. Resize logic (Aggressive resize to avoid 400 Payload Too Large)
      const MAX_WIDTH = 512; 
      const MAX_HEIGHT = 512;
      let width = img.width;
      let height = img.height;

      if (width > height) {
        if (width > MAX_WIDTH) {
          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;
        }
      } else {
        if (height > MAX_HEIGHT) {
          width *= MAX_HEIGHT / height;
          height = MAX_HEIGHT;
        }
      }

      // 3. Draw to canvas
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      // Fill white background just in case of transparency (though we use jpeg)
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);

      // 4. Compress to JPEG (Lower quality to reduce size)
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6); 
      resolve(dataUrl);
    };

    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

// Robust JSON extraction from LLM responses
function extractJSON(text) {
  // Try direct parse first
  try { return JSON.parse(text); } catch(e) {}

  // Strip markdown code fences
  const stripped = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
  try { return JSON.parse(stripped); } catch(e) {}

  // Find first { and last } to extract JSON object from surrounding text
  const start = stripped.indexOf('{');
  const end = stripped.lastIndexOf('}');
  if (start !== -1 && end > start) {
    try { return JSON.parse(stripped.substring(start, end + 1)); } catch(e) {}
  }

  return null;
}

// Validate parsed outfit result has reasonable content
function isValidOutfit(parsed) {
  if (!parsed || typeof parsed.short_desc !== 'string' || typeof parsed.visual_prompt !== 'string') return false;
  // Check short_desc is reasonable Chinese (no garbled Unicode symbols)
  if (parsed.short_desc.length < 2 || parsed.short_desc.length > 20) return false;
  // Reject if it contains known garbled Unicode ranges (squared units, bracket pieces, etc.)
  if (/[\u3300-\u33FF\u2300-\u23FF\u2400-\u243F]/.test(parsed.short_desc)) return false;
  // Check visual_prompt is not truncated (should end reasonably, not mid-word)
  if (parsed.visual_prompt.length < 10) return false;
  return true;
}

      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        base64Image: base64Image
      })

    if (!response.ok) {
        const errBody = await response.text();
        console.error("API Error Body:", errBody);

function initParallaxEffect() {
  const card = document.getElementById('greetingCard');
  const container = document.getElementById('resultSection');
  
  if (!card || !container) return;

  // Mouse Move Event (Desktop)
  container.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Calculate rotation (-10 to 10 degrees)
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    
    const rotateX = ((y - centerY) / centerY) * -10; // Invert Y axis for tilt
    const rotateY = ((x - centerX) / centerX) * 10;

    // Apply Card Tilt
    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;

    // Parallax Image (Move opposite to mouse)
    const img = card.querySelector('.ai-generated-image');
    if (img) {
      const panX = ((x - centerX) / centerX) * -15; // Move opposite
      const panY = ((y - centerY) / centerY) * -15;
      img.style.transform = `scale(1.15) translate(${panX}px, ${panY}px)`;
    }
    
    // Parallax Text (Move slightly with mouse - float above)
    const textElements = card.querySelectorAll('.card-blessing, .card-domain, .card-message');
    textElements.forEach(el => {
      const panX = ((x - centerX) / centerX) * 5;
      const panY = ((y - centerY) / centerY) * 5;
      el.style.transform = `translateZ(30px) translate(${panX}px, ${panY}px)`;
    });
  });

  // Reset on Mouse Leave
  container.addEventListener('mouseleave', () => {
    card.style.transform = 'rotateX(0) rotateY(0) scale3d(1, 1, 1)';
    const img = card.querySelector('.ai-generated-image');
    if (img) img.style.transform = 'scale(1.1) translate(0, 0)';
    
    const textElements = card.querySelectorAll('.card-blessing, .card-domain, .card-message');
    textElements.forEach(el => {
      el.style.transform = 'translateZ(20px) translate(0, 0)';
    });
  });

  // Gyroscope (Mobile) - Basic Tilt
  if (window.DeviceOrientationEvent && 'ontouchstart' in window) {
    window.addEventListener('deviceorientation', (e) => {
      // Limit angles
      let tiltX = e.beta || 0; // -180 to 180 (front/back)
      let tiltY = e.gamma || 0; // -90 to 90 (left/right)
      
      // Clamp values
      if (tiltX > 20) tiltX = 20;
      if (tiltX < -20) tiltX = -20;
      if (tiltY > 20) tiltY = 20;
      if (tiltY < -20) tiltY = -20;
      
      const rotateX = -tiltX; // Invert for natural feel
      const rotateY = tiltY;

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });
  }
}

      return;
  }

  html2canvas(card, {
    scale: 3, // High resolution
    useCORS: true, // Critical for external images (like AI generated ones)
    backgroundColor: null, // Use element's background
    logging: false
  }).then(canvas => {
    // Restore styles
    card.style.transform = originalTransform;
    card.style.transition = originalTransition;

    // Download
    const link = document.createElement('a');
    link.download = `2026_马年好运签_${new Date().getTime()}.png`;
    link.href = canvas.toDataURL('image/png', 1.0);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    showToast('✨ 照片已保存到相册！');
  }).catch(err => {
    console.error('Download failed:', err);
    // Restore styles
    card.style.transform = originalTransform;
    card.style.transition = originalTransition;
    showToast('保存失败，请手动截图保存哦');
  });
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制到剪贴板，快去分享吧！');
  }).catch(() => {
    showToast('长按复制分享给好友');
  });
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// Simple haptic-like sound (just visual for now)
function playFlipSound() {
  if (navigator.vibrate) navigator.vibrate(30);
}

// ============================================================
// FIREWORKS
// ============================================================

const canvas = document.getElementById('fireworks-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let fireworksActive = false;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.decay = Math.random() * 0.02 + 0.01;
    this.size = Math.random() * 3 + 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.05; // gravity
    this.alpha -= this.decay;
    this.size *= 0.98;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function createFirework(x, y) {
  const colors = ['#FF4444', '#FFD700', '#FF6B6B', '#FFA500', '#FF69B4', '#FFE4B5', '#FF8C00'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  for (let i = 0; i < 50; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function animateFireworks() {
  if (!fireworksActive && particles.length === 0) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles = particles.filter(p => p.alpha > 0.01);
  particles.forEach(p => {
    p.update();
    p.draw();
  });

  if (particles.length > 0 || fireworksActive) {
    requestAnimationFrame(animateFireworks);
  }
}

function launchFireworks() {
  fireworksActive = true;
  const w = canvas.width;
  const h = canvas.height;

  // Launch several fireworks
  createFirework(w * 0.3, h * 0.3);
  setTimeout(() => createFirework(w * 0.7, h * 0.25), 200);
  setTimeout(() => createFirework(w * 0.5, h * 0.35), 400);
  setTimeout(() => createFirework(w * 0.2, h * 0.4), 700);
  setTimeout(() => createFirework(w * 0.8, h * 0.3), 900);

  animateFireworks();

  setTimeout(() => { fireworksActive = false; }, 1500);
}

  createFirework(canvas.width * 0.5, canvas.height * 0.2);
  animateFireworks();
